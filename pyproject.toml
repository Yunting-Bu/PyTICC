[project]
name = "pyticc"
version = "0.1.0"
description = "Time-Independent Coupled-Channel quantum scattering code in Python/JAX"
readme = "README.md"
authors = [
    { name = "Yunting-Bu", email = "byt@mail.sdu.edu.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26",
    "loguru>=0.7",
    "scipy>=1.13",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
fortran = [
    "meson>=1.1",
    "ninja>=1.11",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["pyticc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
