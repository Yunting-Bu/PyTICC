# KRb + KRb capture example following the reference 2+2capture input.
type = "diatom-diatom"
diatom_X = ["Rb", "K"]
diatom_Y = ["Rb", "K"]
Jtot = 2
system_parity = 1
energies_cm = [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0]

[approximation]
method = "nncc"
K_delta = 1

[pes]
path = "pes"
sources = ["pes_interface.f"]
wrapper = "pyticc_wrapper.f90"
workdir = "."
processes = 4
lapack = false

[basis_X]
r = [4.8, 13.2]
n_dvr = 99
n_podvr = 3
vmax = 0
jmax = 3

[basis_Y]
r = [4.8, 13.2]
n_dvr = 99
n_podvr = 3
vmax = 0
jmax = 3

[quadrature]
n_theta_X = 21
n_theta_Y = 15
n_phi = 21

[channels]
vmin_X = 0
vmin_Y = 0
exchange_parity_X = 0
exchange_parity_Y = 0
E_X_cut_cm = 100.0
E_Y_cut_cm = 100.0
K_cut = "none"

[propagation]
radial_boundaries = [20.0, 25.0, 60.0, 100.0]
radial_half_steps = [0.05, 0.5, 1.0]
mode = "capture"
memory_limit_mb = 512.0
device = "auto"
print_verbose = false
