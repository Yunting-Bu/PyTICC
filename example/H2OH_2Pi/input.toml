diatom_X = ["H", "H"]
diatom_Y = ["O", "H"]
two_J = 1
system_parity = 1
energies_cm = [30.0, 60.0]

[approximation]
method = "exact"

[basis_X]
r = [0.8, 3.2]
n_dvr = 24
n_podvr = 2
vmax = 0

[basis_Y]
r = [1.2, 3.6]
n_dvr = 24
n_podvr = 2
vmax = 0

[fine_structure.diatom_X]
two_lambda_abs = 0
two_S = 0
two_j_values = [0, 2]
reflection_parity = 1

[fine_structure.diatom_X.constants]
unit = "cm-1"
B = 60.8

[fine_structure.diatom_Y]
two_lambda_abs = 2
two_S = 1
two_j_values = [1]

[fine_structure.diatom_Y.constants]
unit = "cm-1"
A = -139.2
B = 18.9

[fine_structure.pes]
two_total_spins = [1]
orbital_states = [
    { two_lambda_X = 0, two_lambda_Y = -2 },
    { two_lambda_X = 0, two_lambda_Y = 2 },
]

[quadrature]
n_theta_X = 4
n_theta_Y = 4
n_phi = 6

[channels]
E_X_cut_cm = 300.0
E_Y_cut_cm = 300.0
K_cut = "none"

[potential_grid]
radial_boundaries = [6.0, 7.0]
radial_half_steps = [0.25]
processes = 1

[propagation]
mode = "inelastic"
memory_limit_mb = 256.0
device = "cpu"
