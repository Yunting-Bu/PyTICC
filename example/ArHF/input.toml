type = "atom-diatom"
atom = "Ar"
diatom = ["H", "F"]
J = 0
parity = 1
energies_cm = [100.0, 300.0, 500.0]

[approximation]
method = "exact"

[pes]
path = "pes"
sources = ["interaction-PES.f"]
wrapper = "pyticc_wrapper.f90"
workdir = "."
processes = 4

[basis]
r = [1.5, 4.5]
n_dvr = 100
n_podvr = 5
vmin = 0
vmax = 0
jmax = 4
jpar = 0

[quadrature]
n_theta = 35

[truncation]
E_Y_cut_cm = 2000.0
K_cut = "none"

[propagation]
radial_boundaries = [4.5, 6.5, 8.0, 12.0]
radial_half_steps = [0.05, 0.08, 0.10]
mode = "inelastic"
memory_limit_mb = 512.0
