type = "A+BC_electric"
atom = "Ar"
diatom = ["H", "F"]
M = 0
energies_cm = [300.0]

[pes]
path = "../ArHF/pes"
sources = ["interaction-PES.f"]
wrapper = "pyticc_wrapper.f90"
workdir = "."

[basis]
r = [1.5, 4.5]
n_dvr = 100
n_podvr = 5
jmax = 8
lmax = 1
n_alpha = 3

[electric]
strength_au = 1.0e-3
response_csv = "pes/HF_ele.csv"

[quadrature]
n_theta_r = 16
n_theta_R = 16
n_delta = 16
delta_symmetry = true

[channels]
E_Y_cut_cm = 2000.0

[potential_grid]
radial_boundaries = [4.5, 6.5, 8.0, 12.0]
radial_half_steps = [0.05, 0.08, 0.10]
processes = 4

[propagation]
mode = "inelastic"
memory_limit_mb = 512.0
device = "auto"
