# Small full-dimensional H2 + HF demonstration basis; increase the basis and
# propagation range for converged production calculations.
type = "diatom-diatom"
diatom_X = ["H", "H"]
diatom_Y = ["H", "F"]
Jtot = 0
system_parity = 1
energies_cm = [100.0, 300.0, 500.0]

[approximation]
method = "exact"

[pes]
path = "pes"
sources = ["pesh2hf.f"]
wrapper = "pyticc_wrapper.f90"
workdir = "."
processes = 4

[basis_X]
r = [0.4, 3.5]
n_dvr = 99
n_podvr = 5
vmin = 0
vmax = 0
jmax = 2
jpar = 1

[basis_Y]
r = [0.7, 4.7]
n_dvr = 99
n_podvr = 3
vmin = 0
vmax = 0
jmax = 2
jpar = 0

[quadrature]
n_theta_X = 10
n_theta_Y = 10
n_phi = 10

[truncation]
E_X_cut_cm = 1000.0
E_Y_cut_cm = 1000.0
K_cut = "none"

[propagation]
radial_boundaries = [4.5, 6.5, 10.5, 20.5]
radial_half_steps = [0.10, 0.20, 0.50]
mode = "inelastic"
memory_limit_mb = 512.0
device = "auto"
