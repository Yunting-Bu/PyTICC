type = "A+BC_diabatic"
atom = "H"
diatom = ["O", "O"]
Jtot = 0
system_parity = 1
energies_cm = [17.38631, 18.18561, 18.46362, 18.77639]

[approximation]
method = "exact"

[pes]
path = "pes"
sources = ["ho2-dpme.f", "long_range_H_O2.f"]
wrapper = "pyticc_wrapper.f90"
workdir = "."
n_state = 2
lapack = true

[basis]
r = [1.2, 5.0]
n_dvr = 135
n_podvr = 80
vmax = [29, 26]
jmax = [55, 56]

[quadrature]
n_theta = 30

[channels]
vmin_Y = [0, 0]
exchange_parity_Y = [-1, 1]
E_Y_cut_cm = 38000.0
K_cut = "none"

[potential_grid]
radial_boundaries = [0.8, 2.5, 6.0, 30.0]
radial_half_steps = [0.002, 0.005, 0.3]
processes = 4

[propagation]
mode = "inelastic"
memory_limit_mb = 4096.0
device = "auto"
print_verbose = true
